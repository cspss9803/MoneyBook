<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MoneyBook" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>MoneyBook</title>

  <!-- 0 秒防閃白主題預載 -->
  <script>
    if (localStorage.getItem('mb_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <link rel="stylesheet" href="./style.css" />

  <style>
    :root {
      --chart-track: #f1f5f9;
    }
    html.dark {
      --chart-track: #1e293b;
      color-scheme: dark;
    }

    /* 停用手機瀏覽器下拉重新整理 (Pull-to-refresh) */
    html, body {
      overscroll-behavior-y: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }
    input[type="number"] {
      appearance: textfield;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 原生啟動遮罩，支援亮暗雙色 */
    #app-loader {
      position: fixed;
      inset: 0;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }
    html.dark #app-loader {
      background-color: #020617;
    }
    #app-loader .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #cbd5e1;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: mb-spin 0.7s linear infinite;
    }
    html.dark #app-loader .spinner {
      border-color: #334155;
      border-top-color: #f8fafc;
    }
    #app-loader .loader-text {
      margin-top: 12px;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      letter-spacing: 0.05em;
    }
    html.dark #app-loader .loader-text {
      color: #94a3b8;
    }
    @keyframes mb-spin {
      to { transform: rotate(360deg); }
    }

    /* 全域深色模式語意映射 */
    html.dark body,
    html.dark .bg-slate-100 {
      background-color: #020617 !important;
      color: #f1f5f9 !important;
    }
    html.dark #app,
    html.dark .bg-slate-50 {
      background-color: #090d16 !important;
    }
    html.dark .bg-white {
      background-color: #0f172a !important;
    }
    html.dark .bg-slate-200 {
      background-color: #1e293b !important;
    }
    html.dark .bg-slate-900 {
      background-color: #334155 !important;
      color: #f8fafc !important;
    }
    html.dark .bg-slate-900\/40,
    html.dark .bg-slate-900\/50 {
      background-color: rgba(2, 6, 23, 0.75) !important;
    }
    html.dark .text-slate-900,
    html.dark .text-slate-800 {
      color: #f8fafc !important;
    }
    html.dark .text-slate-700,
    html.dark .text-slate-600 {
      color: #cbd5e1 !important;
    }
    html.dark .text-slate-500,
    html.dark .text-slate-400 {
      color: #94a3b8 !important;
    }
    html.dark .text-slate-300 {
      color: #475569 !important;
    }
    html.dark .border-slate-200,
    html.dark .border-slate-100 {
      border-color: #1e293b !important;
    }
    html.dark .border-slate-300 {
      border-color: #334155 !important;
    }
    html.dark .border-slate-900 {
      border-color: #94a3b8 !important;
    }
    html.dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]),
    html.dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) {
      border-color: #1e293b !important;
    }
    html.dark .hover\:bg-slate-50:hover,
    html.dark .hover\:bg-slate-100:hover,
    html.dark .active\:bg-slate-50:active,
    html.dark .active\:bg-slate-100:active {
      background-color: #1e293b !important;
    }
    html.dark .text-rose-600 { color: #fb7185 !important; }
    html.dark .text-emerald-600, html.dark .text-emerald-700 { color: #34d399 !important; }
    html.dark .text-amber-700, html.dark .text-amber-800 { color: #fbbf24 !important; }
    html.dark .text-teal-800 { color: #2dd4bf !important; }
    html.dark .bg-amber-50 { background-color: rgba(245, 158, 11, 0.12) !important; }
    html.dark .border-amber-200 { border-color: rgba(245, 158, 11, 0.3) !important; }
    html.dark .bg-emerald-50 { background-color: rgba(16, 185, 129, 0.12) !important; }
    html.dark .border-emerald-200 { border-color: rgba(16, 185, 129, 0.3) !important; }
    html.dark .bg-teal-50 { background-color: rgba(20, 184, 166, 0.12) !important; }
    html.dark .border-teal-200 { border-color: rgba(20, 184, 166, 0.3) !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-slate-800 selection:text-white">
  <!-- 啟動載入遮擋畫面 -->
  <div id="app-loader">
    <div class="spinner"></div>
    <div class="loader-text">MoneyBook 載入中...</div>
  </div>

  <!-- 手機主容器 -->
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 border-x border-slate-200 pb-20 relative"></div>

  <!-- 抽屜與彈窗掛載點 -->
  <div id="modal-root"></div>

  <!-- 唯一 JS 入口 -->
  <script type="module" src="./main.js"></script>
</body>
</html>
