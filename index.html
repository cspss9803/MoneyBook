<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MoneyBook" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>MoneyBook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            appearance: textfield;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 原生啟動遮罩，不依賴 Tailwind 即時編譯 */
        #app-loader {
            position: fixed;
            inset: 0;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.2s ease-out;
        }
        #app-loader .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #cbd5e1;
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: mb-spin 0.7s linear infinite;
        }
        #app-loader .loader-text {
            margin-top: 12px;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.05em;
        }
        @keyframes mb-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-slate-800 selection:text-white">
    <!-- 啟動載入遮擋畫面 -->
    <div id="app-loader">
        <div class="spinner"></div>
        <div class="loader-text">MoneyBook 載入中...</div>
    </div>

    <!-- 手機主容器 -->
    <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 border-x border-slate-200 pb-20 relative"></div>

    <!-- 抽屜與彈窗掛載點 -->
    <div id="modal-root"></div>

    <!-- 唯一 JS 入口 -->
    <script type="module" src="./main.js"></script>
</body>
</html>
